name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 500M
  CONAN_HOME: ${{ github.workspace }}/.conan2

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cpp: ${{ steps.classify.outputs.cpp }}
      python: ${{ steps.classify.outputs.python }}
      automation: ${{ steps.classify.outputs.automation }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify impacted lanes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: scripts/ci/changes.py

  # Any source rename/deletion can invalidate a documentation link, so this cheap
  # lane is unconditional and does not require a native build or submodule checkout.
  docs:
    name: Documentation contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Check documentation
        run: nix develop .#ci --command just docs-check

  python:
    name: Python quality
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run Python checks
        run: nix develop .#ci --command scripts/ci/python

  ci-contracts:
    name: CI contracts
    needs: changes
    if: needs.changes.outputs.automation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test change classification
        run: scripts/ci/contracts

  shellcheck:
    name: ShellCheck
    needs: changes
    if: needs.changes.outputs.automation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check shell scripts
        run: scripts/ci/shellcheck

  actionlint:
    name: Actionlint
    needs: changes
    if: needs.changes.outputs.automation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.11"
          cache: false

      - name: Install actionlint
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/actionlint"
          GOBIN="$RUNNER_TEMP/actionlint" \
            go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Check Actions workflows
        run: scripts/ci/actionlint

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Check formatting
        run: nix develop .#ci --command scripts/ci/format

  build-test:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Restore trusted debug cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ${{ env.CONAN_HOME }}
            ${{ env.CCACHE_DIR }}
            .zig-cache
            build/*/_deps/ghostty/*/zig-cache
          key: frame-v1-${{ runner.os }}-${{ runner.arch }}-debug-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules', 'third_party/ghostty-metadata/PIN.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            frame-v1-${{ runner.os }}-${{ runner.arch }}-debug-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules', 'third_party/ghostty-metadata/PIN.json') }}-${{ github.sha }}-
            frame-v1-${{ runner.os }}-${{ runner.arch }}-debug-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules', 'third_party/ghostty-metadata/PIN.json') }}-

      - name: Build and run tests
        run: nix develop .#ci --command scripts/ci/build-test

      - name: Save trusted debug cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ${{ env.CONAN_HOME }}
            ${{ env.CCACHE_DIR }}
            .zig-cache
            build/*/_deps/ghostty/*/zig-cache
          key: frame-v1-${{ runner.os }}-${{ runner.arch }}-debug-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules', 'third_party/ghostty-metadata/PIN.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  clang-tidy:
    name: Clang-tidy
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Restore trusted debug cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ${{ env.CONAN_HOME }}
            ${{ env.CCACHE_DIR }}
            .zig-cache
            build/*/_deps/ghostty/*/zig-cache
          key: frame-v1-${{ runner.os }}-${{ runner.arch }}-debug-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules', 'third_party/ghostty-metadata/PIN.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            frame-v1-${{ runner.os }}-${{ runner.arch }}-debug-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules', 'third_party/ghostty-metadata/PIN.json') }}-${{ github.sha }}-
            frame-v1-${{ runner.os }}-${{ runner.arch }}-debug-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules', 'third_party/ghostty-metadata/PIN.json') }}-

      - name: Run clang-tidy
        run: nix develop .#ci --command scripts/ci/lint

  clangd:
    name: Clangd
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Restore trusted debug cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ${{ env.CONAN_HOME }}
            ${{ env.CCACHE_DIR }}
            .zig-cache
            build/*/_deps/ghostty/*/zig-cache
          key: frame-v1-${{ runner.os }}-${{ runner.arch }}-debug-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules', 'third_party/ghostty-metadata/PIN.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            frame-v1-${{ runner.os }}-${{ runner.arch }}-debug-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules', 'third_party/ghostty-metadata/PIN.json') }}-${{ github.sha }}-
            frame-v1-${{ runner.os }}-${{ runner.arch }}-debug-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules', 'third_party/ghostty-metadata/PIN.json') }}-

      - name: Run clangd checks
        run: nix develop .#ci --command scripts/ci/lsp

  sanitizers:
    name: Address and undefined behavior sanitizers
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Restore trusted sanitizer cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ${{ env.CONAN_HOME }}
            ${{ env.CCACHE_DIR }}
            .zig-cache
            build/*/_deps/ghostty/*/zig-cache
          key: frame-v1-${{ runner.os }}-${{ runner.arch }}-sanitizers-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules', 'third_party/ghostty-metadata/PIN.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            frame-v1-${{ runner.os }}-${{ runner.arch }}-sanitizers-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules', 'third_party/ghostty-metadata/PIN.json') }}-${{ github.sha }}-
            frame-v1-${{ runner.os }}-${{ runner.arch }}-sanitizers-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules', 'third_party/ghostty-metadata/PIN.json') }}-

      - name: Run sanitizer suite
        run: nix develop .#ci --command scripts/ci/sanitizers

      - name: Upload sanitizer and simulation failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitizer-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/sanitizers/fuzz-artifacts
            build/sanitizers/mux-sim-artifacts
            build/sanitizers/steady-state-work-audit.json
            build/sanitizers/deterministic-budget-results.json
            build/mux-sim-failures
          if-no-files-found: ignore
          retention-days: 14

      - name: Save trusted sanitizer cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ${{ env.CONAN_HOME }}
            ${{ env.CCACHE_DIR }}
            .zig-cache
            build/*/_deps/ghostty/*/zig-cache
          key: frame-v1-${{ runner.os }}-${{ runner.arch }}-sanitizers-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/profiles/llvm', 'flake.lock', 'CMakeLists.txt', '.gitmodules', 'third_party/ghostty-metadata/PIN.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  gate:
    name: CI gate
    needs:
      - changes
      - docs
      - python
      - ci-contracts
      - shellcheck
      - actionlint
      - format
      - build-test
      - clang-tidy
      - clangd
      - sanitizers
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every selected lane
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PYTHON_SELECTED: ${{ needs.changes.outputs.python }}
          PYTHON_RESULT: ${{ needs.python.result }}
          AUTOMATION_SELECTED: ${{ needs.changes.outputs.automation }}
          CI_CONTRACTS_RESULT: ${{ needs.ci-contracts.result }}
          SHELLCHECK_RESULT: ${{ needs.shellcheck.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          CPP_SELECTED: ${{ needs.changes.outputs.cpp }}
          FORMAT_RESULT: ${{ needs.format.result }}
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
          CLANG_TIDY_RESULT: ${{ needs.clang-tidy.result }}
          CLANGD_RESULT: ${{ needs.clangd.result }}
          SANITIZERS_RESULT: ${{ needs.sanitizers.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "::error::change classification ended with $CHANGES_RESULT"
            exit 1
          fi

          failed=0
          for entry in \
            "docs:true:$DOCS_RESULT" \
            "python:$PYTHON_SELECTED:$PYTHON_RESULT" \
            "ci-contracts:$AUTOMATION_SELECTED:$CI_CONTRACTS_RESULT" \
            "shellcheck:$AUTOMATION_SELECTED:$SHELLCHECK_RESULT" \
            "actionlint:$AUTOMATION_SELECTED:$ACTIONLINT_RESULT" \
            "format:$CPP_SELECTED:$FORMAT_RESULT" \
            "build-test:$CPP_SELECTED:$BUILD_TEST_RESULT" \
            "clang-tidy:$CPP_SELECTED:$CLANG_TIDY_RESULT" \
            "clangd:$CPP_SELECTED:$CLANGD_RESULT" \
            "sanitizers:$CPP_SELECTED:$SANITIZERS_RESULT"
          do
            name="${entry%%:*}"
            remainder="${entry#*:}"
            selected="${remainder%%:*}"
            result="${remainder#*:}"
            if [[ "$selected" == true && "$result" != success ]]; then
              echo "::error::$name was selected but ended with $result"
              failed=1
            elif [[ "$selected" != true && "$result" != skipped && "$result" != success ]]; then
              echo "::error::$name unexpectedly ended with $result"
              failed=1
            fi
          done
          exit "$failed"
