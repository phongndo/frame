name: Nightly

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require tested main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$GITHUB_SHA" == "$main_sha" ]] || { echo "Nightly source is not the main tip." >&2; exit 1; }
          if nightly_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/vnightly" --jq .sha 2>/dev/null)" &&
             [[ "$nightly_sha" == "$GITHUB_SHA" ]] &&
             gh release view vnightly --json isDraft,isPrerelease,assets |
               jq -e '
                 [.assets[] | select(.state == "uploaded" and .size > 0) | .name] as $uploaded |
                 select(.isPrerelease and (.isDraft | not)) |
                 ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
                 | map("frame-vnightly-\(.).tar.gz" | ., . + ".sha256") as $expected
                 | ($expected - $uploaded | length == 0)
               ' >/dev/null; then
            echo "Nightly already contains all packages and checksums for $GITHUB_SHA."
            exit 0
          fi

          quality_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          [[ -n "$quality_run" ]] || { echo "No successful CI push run for $GITHUB_SHA" >&2; exit 1; }
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/distribution.yml/runs?head_sha=$GITHUB_SHA&branch=main&status=success&per_page=100" \
            --jq '.workflow_runs | map(select(.event == "push" or .event == "workflow_dispatch")) | first | .id // empty')"
          [[ -n "$run_id" ]] || { echo "No successful Distribution run for $GITHUB_SHA" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the verified distribution bytes
        if: steps.source.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: frame-*
          path: build/distribution
          merge-multiple: true

      - name: Name the archives for the nightly channel
        if: steps.source.outputs.run_id != ''
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(build/distribution/*.tar.gz)
          if (( ${#archives[@]} != 3 )); then
            echo "Nightly needs three distribution archives. Run Distribution on main to regenerate them." >&2
            exit 1
          fi
          python3 scripts/ci/distribution.py retag --tag vnightly --output build/nightly "${archives[@]}"
          [[ "$(find build/nightly -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3 ]]
          (cd build/nightly && sha256sum --check ./*.sha256)

      - name: Publish mutable prerelease
        if: steps.source.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/nightly-notes.md" <<EOF
          Nightly build of tested main at $GITHUB_SHA. Expect breaking changes.

          Install it with the install script:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/phongndo/frame/main/scripts/install.sh | FRAME_VERSION=nightly sh
          \`\`\`

          Or switch an existing install script installation to it:

          \`\`\`sh
          frame update --version nightly
          \`\`\`

          Run \`frame update\` to return to the latest stable release. See the
          [installation guide](https://github.com/phongndo/frame/blob/main/docs/installation.md#nightly-builds).
          EOF
          if gh release view vnightly >/dev/null 2>&1; then
            gh release upload vnightly build/nightly/* --clobber
            gh release edit vnightly --prerelease --latest=false --target "$GITHUB_SHA" \
              --title 'Frame nightly' --notes-file "$RUNNER_TEMP/nightly-notes.md"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/vnightly" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create vnightly build/nightly/* --prerelease --latest=false \
              --target "$GITHUB_SHA" --title 'Frame nightly' \
              --notes-file "$RUNNER_TEMP/nightly-notes.md"
          fi
