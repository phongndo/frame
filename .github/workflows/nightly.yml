name: Nightly

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require tested main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$GITHUB_SHA" == "$main_sha" ]] || { echo "Nightly source is not the main tip." >&2; exit 1; }
          for workflow in quality.yml distribution.yml; do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" \
              --jq '.workflow_runs | map(select(.event == "push" and .head_branch == "main")) | first | .id // empty')"
            [[ -n "$run_id" ]] || { echo "No successful $workflow push run for $GITHUB_SHA" >&2; exit 1; }
          done
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the verified distribution bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: frame-*
          path: build/distribution
          merge-multiple: true

      - name: Name the archives for the nightly channel
        run: |
          set -euo pipefail
          python3 scripts/ci/distribution.py retag --tag vnightly --output build/nightly \
            build/distribution/*.tar.gz
          [[ "$(find build/nightly -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3 ]]
          (cd build/nightly && sha256sum --check ./*.sha256)

      - name: Publish mutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/nightly-notes.md" <<EOF
          Nightly build of tested main at $GITHUB_SHA. Expect breaking changes.

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/phongndo/frame/main/scripts/install.sh | FRAME_VERSION=nightly sh
          frame update --version nightly  # from an existing portable installation
          \`\`\`

          Run \`frame update\` to return to the latest stable release. See the
          [installation guide](https://github.com/phongndo/frame/blob/main/docs/installation.md#nightly-builds).
          EOF
          if gh release view vnightly >/dev/null 2>&1; then
            gh release upload vnightly build/nightly/* --clobber
            gh release edit vnightly --prerelease --latest=false --target "$GITHUB_SHA" \
              --title 'Frame nightly' --notes-file "$RUNNER_TEMP/nightly-notes.md"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/vnightly" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create vnightly build/nightly/* --prerelease --latest=false \
              --target "$GITHUB_SHA" --title 'Frame nightly' \
              --notes-file "$RUNNER_TEMP/nightly-notes.md"
          fi
