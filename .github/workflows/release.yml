name: Release

# Publishes the project version when a push to main carries one that has no release yet, once that
# commit's CI and Distribution runs pass (see "Release packages" in docs/development.md). The
# Installs workflow then installs it the ways the README documents. Dispatching it from main
# retries a failed release.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Find an unreleased version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Skip a released version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(python3 scripts/ci/distribution.py version)"
          if [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
            echo "$tag is already released; bump the version to release again."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for the commit's CI and Distribution runs
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null)"; then
            [[ "$existing" == "$GITHUB_SHA" ]]
          fi
          for workflow in quality.yml distribution.yml; do
            # The push that started this run started those too; give them time to appear.
            run_id=
            for _ in {1..30}; do
              run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&branch=main" \
                --jq '.workflow_runs[0].id // empty')"
              [[ -n "$run_id" ]] && break
              sleep 10
            done
            [[ -n "$run_id" ]] || { echo "No $workflow push run for $GITHUB_SHA" >&2; exit 1; }
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 60 >/dev/null ||
              { echo "$workflow failed for $GITHUB_SHA" >&2; exit 1; }
          done
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download the verified distribution bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: frame-*
          path: build/distribution
          merge-multiple: true

      - name: Verify and generate release metadata
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$(find build/distribution -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3 ]]
          [[ "$(find build/distribution -maxdepth 1 -name '*.sha256' | wc -l)" -eq 3 ]]
          (cd build/distribution && sha256sum --check ./*.sha256)
          python3 scripts/ci/distribution.py formula --tag "$RELEASE_TAG" \
            --checksums build/distribution --output build/distribution/frame.rb
          cp scripts/install.sh build/distribution/install.sh

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Install Frame for testing:

          ```sh
          brew install phongndo/tap/frame
          frame new --cwd "$PWD"
          ```

          The [installation guide](https://github.com/phongndo/frame/blob/main/docs/installation.md) covers the install script, mise, and Nix. Update an installation with `frame update`.

          Early release for Apple Silicon macOS and ARM64/x86-64 glibc Linux.
          EOF
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [[ "$draft" == true ]] || { echo 'Published releases are immutable; bump the version.' >&2; exit 1; }
            # A draft left by an earlier attempt may have been for another commit.
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA"
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "Frame $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" build/distribution/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi

      - name: Notify Homebrew tap
        if: ${{ !contains(steps.source.outputs.tag, '-') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -n "$GH_TOKEN" ]]; then
            gh api --method POST repos/phongndo/homebrew-tap/dispatches -f event_type=frame-release
          else
            echo 'The Homebrew tap updater will pick up this release on its next hourly run.'
          fi

  installs:
    needs: [version, publish]
    if: ${{ !contains(needs.version.outputs.tag, '-') }}
    uses: ./.github/workflows/installs.yml
